<!DOCTYPE html>
<html lang="{{ site.lang | default: "ja" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/manibo-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if page.url == "/" %}
      <header class="site-hero">
        <img src="{{ '/assets/images/manibo-icon.png' | relative_url }}" alt="" width="96" height="96">
        <h1>{{ site.title }}</h1>
      </header>
      {% else %}
      <header class="site-header">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/manibo-icon.png' | relative_url }}" alt="" width="32" height="32">
          <span>{{ site.title }}</span>
        </a>
      </header>
      {% endif %}

      {{ content }}

      <footer class="site-footer">
        <img class="site-footer-symbol" src="{{ '/assets/images/tokiwagi-knot-symbol.png' | relative_url }}" alt="" width="17" height="32">
        <img class="site-footer-wordmark" src="{{ '/assets/images/tokiwagi-knot-wordmark.png' | relative_url }}" alt="TOKIWAGI KNOT" width="161" height="12">
        <p>&copy; {{ 'now' | date: '%Y' }} TOKIWAGI KNOT</p>
      </footer>
    </div>
  </body>
</html>
